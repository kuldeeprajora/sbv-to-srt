name: Build standalone apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: SBV-to-SRT-macOS
            artifact-path: dist/SBV-to-SRT-macOS.zip
          - os: windows-latest
            artifact-name: SBV-to-SRT-Windows
            artifact-path: dist/SBV-to-SRT.exe

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.2

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Construct desktop UI
        run: python tests/gui_smoke.py

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SBV-to-SRT sbv_to_srt_gui.py

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --clean --onedir --windowed --name "SBV to SRT" sbv_to_srt_gui.py

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/SBV to SRT.app" "dist/SBV-to-SRT-macOS.zip"

      - name: Upload standalone app
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download standalone apps
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --generate-notes
