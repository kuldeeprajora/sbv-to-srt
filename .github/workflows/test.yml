name: Cross-platform tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show runtime versions
        run: python -c "import sys, tkinter as tk; print(sys.version); print('Tk', tk.TkVersion)"

      - name: Run conversion tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Construct desktop UI
        run: python tests/gui_smoke.py

      - name: Check command-line interface
        run: python sbv_to_srt.py --help
